<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>My first three.js app</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
		overflow-y: hidden;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js",
          "jsm/": "https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/"
        }
      }
    </script>
    <link rel="stylesheet" href="../../shared/navigation.css" />
    <link rel="stylesheet" href="../planetHud.css" />
  </head>
  <body>
    <script type="module" src="main.js"></script>

    <!-- Planet HUD System -->
    <script type="module">
      import { PlanetHUD } from '../planetHud.js';
      const hud = new PlanetHUD();
      hud.show('moon');
    </script>

    <!-- Navigation System -->
    <script type="module">
      import Navigation from '../../shared/navigation.js';
      const nav = new Navigation({
        aboutLink: '../../ABOUTPROJECT/index.html',
        currentScene: 'PLANET_DETAIL',
        currentPlanet: 'moon'
      });

      // Hardcode NEXT for moon → sun
      const nextBtn = document.querySelector('.next-button');
      if (!nextBtn) {
        const btn = document.createElement('button');
        btn.className = 'next-button';
        btn.type = 'button';
        btn.textContent = 'NEXT';
        btn.addEventListener('click', () => {
          window.location.href = '../../OBJECTS2/sun/index.html';
        });
        document.querySelector('.nav-buttons').appendChild(btn);
      }
    </script>
  </body>
</html>
